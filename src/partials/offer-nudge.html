<!-- One-time nudge. JS-only by design: display:none until the script opts it in. -->
<aside class="nudge" id="nudge" role="complementary" aria-label="Offer reminder">
  <span class="nudge__icon" aria-hidden="true">
    <svg width="19" height="19" viewBox="0 0 16 16" fill="none">
      <path d="M8 1.6 9.9 5.5l4.3.6-3.1 3 .7 4.3L8 11.4l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
  </span>
  <div>
    <p class="nudge__title">Still deciding?</p>
    <p class="nudge__body">$20 off your first build. <a href="#contact">Take the call</a> and mention it.</p>
  </div>
  <button class="nudge__x" id="nudge-close" type="button" aria-label="Dismiss">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
</aside>
