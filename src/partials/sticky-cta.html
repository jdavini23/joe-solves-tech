<!-- Sticky book-now bar. CSS-only, so it is there with or without JS.
     "3 slots" must be TRUE the day you publish. Set it to your real
     number or change the line — a fake countdown is the one thing
     that will cost you trust with this audience. -->
<div class="bar">
  <div class="wrap bar__inner">
    <div class="bar__copy">
      <p class="bar__title">Free 20-minute call</p>
      <p class="bar__note">
        <span class="bar__dot" aria-hidden="true"></span>
        3 build slots open this week
      </p>
    </div>
    <a class="btn btn--accent btn--sparkle" href="#contact">Book now</a>
  </div>
</div>
